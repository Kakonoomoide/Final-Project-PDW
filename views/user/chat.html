<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat AI - Tani Makmur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* Tinggi area chat dikunci biar yang nge-scroll cuma daftar pesannya,
       header sama kotak ketiknya tetep keliatan di tempat. */
    #chat-box {
      height: 55vh;
      min-height: 320px;
      overflow-y: auto;
      background-color: #f8f9fa;
    }
    .bubble {
      max-width: 85%;
      white-space: pre-wrap; /* newline dari balasan AI ikut kebaca */
      word-wrap: break-word;
    }
    .bubble-user { background-color: #198754; color: #fff; }
    .bubble-ai { background-color: #fff; border: 1px solid #dee2e6; }
    #foto-preview { max-height: 180px; object-fit: contain; }
  </style>
</head>
<body class="bg-light">
  <div data-include="/partials/navbar-user.html"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-9">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h4 mb-0">🌱 Konsultasi Pertanian</h1>
            <p class="text-muted small mb-0">
              Tanya seputar tanaman, atau upload foto buat deteksi hama &amp; penyakit.
            </p>
          </div>
          <button class="btn btn-outline-danger btn-sm" id="btn-clear" hidden>Hapus Riwayat</button>
        </div>

        <!-- Endpoint chat butuh login (tiap user punya riwayat sendiri),
             jadi kalo belum login yang ditampilin ajakan login, bukan form -->
        <div class="alert alert-warning d-none" id="need-login">
          Kamu harus <a href="/login" class="alert-link">login</a> dulu buat mulai
          konsultasi. Belum punya akun? <a href="/register" class="alert-link">daftar di sini</a>.
        </div>

        <div class="alert alert-danger d-none" id="chat-error"></div>

        <div id="chat-area" class="d-none">
          <div class="card shadow-sm">
            <div class="card-body p-3" id="chat-box">
              <!-- diisi otomatis lewat /js/chat.js -->
            </div>

            <div class="card-footer bg-white">
              <!-- ================= Kirim pesan teks ================= -->
              <form id="chat-form" class="d-flex gap-2 align-items-end">
                <textarea
                  class="form-control"
                  id="chat-input"
                  rows="1"
                  maxlength="2000"
                  placeholder="Contoh: Daun cabai saya menguning dan keriting, kenapa ya?"
                  required
                ></textarea>
                <button class="btn btn-success" type="submit" id="btn-send">Kirim</button>
              </form>

              <!-- ============ Deteksi hama/penyakit via foto ============ -->
              <div class="mt-3 pt-3 border-top">
                <label class="form-label small fw-semibold mb-1">
                  📷 Deteksi hama &amp; penyakit dari foto
                </label>

                <div class="d-flex gap-2 flex-wrap align-items-center">
                  <input
                    type="file"
                    class="form-control form-control-sm"
                    id="foto-input"
                    accept="image/png, image/jpeg, image/webp"
                    style="max-width: 300px;"
                  />
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    id="foto-note"
                    style="max-width: 260px;"
                    maxlength="200"
                    placeholder="Catatan (opsional): tanaman apa, umur, dll"
                  />
                  <button class="btn btn-outline-success btn-sm" id="btn-detect" disabled>
                    Analisa Foto
                  </button>
                </div>

                <div class="mt-2 d-none" id="foto-preview-wrap">
                  <img id="foto-preview" class="img-thumbnail" alt="Preview foto tanaman" />
                </div>
              </div>
            </div>
          </div>

          <p class="text-muted small mt-2 mb-0">
            Jawaban dibuat AI (Gemini) dan bisa saja keliru — buat kasus berat,
            tetap konsultasi ke penyuluh pertanian setempat ya.
          </p>
        </div>

      </div>
    </div>
  </main>

  <script src="/js/include-partials.js"></script>
  <script src="/js/navbar-auth.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
