<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - Tani Makmur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 400px;">
      <div class="card-body">
        <h1 class="h4 card-title mb-3 text-center">Daftar Akun</h1>
        <p class="text-muted small text-center mb-3">Pendaftaran ini buat akun user biasa. Akun admin dibuat terpisah oleh pengelola.</p>

        <div id="form-error" class="alert alert-danger d-none"></div>

        <form id="register-form">
          <div class="mb-3">
            <label class="form-label">Nama</label>
            <input type="text" class="form-control" id="name" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min. 6 karakter)</label>
            <input type="password" class="form-control" id="password" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Daftar</button>
        </form>

        <p class="text-center small mt-3 mb-0">
          Udah punya akun? <a href="/login">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
