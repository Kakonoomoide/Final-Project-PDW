<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDW App</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 420px;">
      <div class="card-body text-center">
        <h1 class="h4 card-title mb-1">PDW App</h1>
        <p class="text-muted small mb-4">Express + SQLite + Bootstrap</p>

        <p class="mb-3">
          Status backend:
          <span id="health-badge" class="badge bg-secondary">Mengecek...</span>
        </p>

        <pre id="health-output" class="bg-white border rounded p-2 text-start small mb-3"></pre>

        <button id="btn-check-health" class="btn btn-primary btn-sm w-100">
          Cek Ulang
        </button>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
  <script src="/js/main.js"></script>
</body>
</html>
