<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola News - Tani Makmur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/news.css" />
</head>
<body>
  <div data-include="/partials/navbar-admin.html"></div>

  <div class="d-flex">
    <div data-include="/partials/sidebar-admin.html"></div>

    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1">Kelola News</h2>
          <p class="text-muted mb-0">Kelola berita pertanian Tani Makmur.</p>
        </div>

        <button class="btn btn-success" onclick="openCreateModal()">
          + Tambah Berita
        </button>
      </div>

      <div id="alertContainer"></div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th width="60">No</th>
                  <th>Judul</th>
                  <th>Caption</th>
                  <th>Isi</th>
                  <th>Gambar</th>
                  <th width="170">Aksi</th>
                </tr>
              </thead>

              <tbody id="newsTableBody">
                <tr>
                  <td colspan="6" class="text-center">
                    Memuat data...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="newsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Tambah Berita</h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>

        <div class="modal-body">
          <form id="newsForm">
            <input type="hidden" id="newsId" />

            <div class="mb-3">
              <label class="form-label">Judul Berita</label>

              <input
                type="text"
                id="title"
                class="form-control"
                placeholder="Masukkan judul berita"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Isi Berita</label>

              <textarea
                id="content"
                class="form-control"
                rows="6"
                placeholder="Masukkan isi berita"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Caption</label>

              <textarea
                id="caption"
                class="form-control"
                rows="3"
                placeholder="Masukkan caption berita"
              ></textarea>

              <button
                type="button"
                id="generateCaptionBtn"
                class="btn btn-outline-success btn-sm mt-2"
                onclick="generateCaption()"
              >
                Generate Caption dengan AI
              </button>
            </div>

            <div
              id="captionSuggestions"
              class="mb-3"
              style="display: none;"
            >
              <label class="form-label">
                Pilihan Caption AI
              </label>

              <div id="captionOptions"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">URL Gambar</label>

              <input
                type="url"
                id="imageUrl"
                class="form-control"
                placeholder="https://contoh.com/gambar.jpg"
              />
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Batal
          </button>

          <button
            type="button"
            class="btn btn-success"
            id="saveNewsBtn"
            onclick="saveNews()"
          >
            Simpan
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include-partials.js"></script>
  <script src="/js/navbar-auth.js"></script>
  <script src="/js/news.js"></script>
</body>
</html>
