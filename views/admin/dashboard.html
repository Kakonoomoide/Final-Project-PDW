<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin - TrAvelIt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/navbar-admin.html"></div>

  <div class="d-flex">
    <div data-include="/partials/sidebar-admin.html"></div>

    <main class="flex-grow-1 p-4">
      <h1 class="h3">Dashboard Admin</h1>
      <p class="text-muted">Selamat datang di panel admin TrAvelIt.</p>

      <div class="row g-3 mt-1" id="kartu-statistik">
        <div class="col-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Pengguna terdaftar</div>
              <div class="h3 mb-0" id="stat-user">–</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Rencana perjalanan</div>
              <div class="h3 mb-0" id="stat-trip">–</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Destinasi</div>
              <div class="h3 mb-0" id="stat-destinasi">–</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Artikel</div>
              <div class="h3 mb-0" id="stat-artikel">–</div>
            </div>
          </div>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        Angka di atas cuma jumlah. Isi rencana perjalanan pengguna tidak bisa
        dibuka dari panel admin — tiap trip cuma bisa diakses pemiliknya sendiri.
      </p>
    </main>
  </div>

  <script src="/js/include-partials.js"></script>
  <script src="/js/navbar-auth.js"></script>
  <script>
    // Cuma 4 angka, gak perlu file JS terpisah - taruh inline aja di sini.
    fetch('/api/admin/stats')
      .then((res) => res.json())
      .then((result) => {
        if (!result.success) return;
        document.getElementById('stat-user').textContent = result.data.totalUser;
        document.getElementById('stat-trip').textContent = result.data.totalTrip;
        document.getElementById('stat-destinasi').textContent = result.data.totalDestinasi;
        document.getElementById('stat-artikel').textContent = result.data.totalArtikel;
      })
      .catch(() => {
        // Biarin tanda "–" yang muncul. Dashboard gagal ambil angka itu
        // bukan alasan buat nampilin pesan error segede halaman.
      });
  </script>
</body>
</html>
